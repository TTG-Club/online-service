server:
  port: 8092
  forward-headers-strategy: framework

spring:
  application:
    name: ttg-online-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: true

online:
  # Сайты, которые разрешено учитывать. Добавление нового сайта = добавить siteId в этот список.
  #
  # У VTTG аудитории две, и это разные люди, а не разные экраны одного и того же:
  # "vttg" — те, у кого запущено само приложение, "vttg-play" — те, кто пришёл за чужой
  # стол по ссылке и обходится браузером. Складывать их в один набор нельзя: один человек
  # с открытой панелью и открытым миром получил бы два ключа и стал бы двумя онлайнами.
  allowed-sites:
    - "5e24"
    - "5e14"
    - "vttg"
    - "vttg-play"

  # Значение по умолчанию для windowMinutes, если параметр не передали
  default-window-minutes: 30

  # Ограничение окна (чтобы не давать клиенту ставить 999999)
  min-window-minutes: 1
  max-window-minutes: 1440

  # Параметры хранения в Redis
  redis:
    key-prefix: "online:"
    # как часто (сек) можно запускать периодическую очистку "устаревших" записей,
    # если вы сделаете scheduled-cleaner (опционально)
    cleanup:
      enabled: true
      fixed-delay: 30s

  # Статистика настроек отображения (тема, ширина сайта): уникальные посетители за сутки.
  preferences:
    # Какие настройки из heartbeat учитывать, остальные отбрасываются
    tracked:
      - "theme"
      - "width"
    # Сколько разных значений одной настройки запоминать (защита от мусора)
    max-values: 16
    # Сколько дней хранить дневные счётчики
    retention-days: 30
    # За какие периоды (в днях) отдавать статистику в /stats/{siteId}
    periods-days:
      - 1
      - 7
      - 30
    # По какому часовому поясу режутся сутки
    zone: "Europe/Moscow"

logging:
  level:
    root: INFO
    club.ttg.online: INFO
